name: Publish

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  pack-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install convco
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip curl
          curl -sSL -o convco-deb.zip https://github.com/convco/convco/releases/latest/download/convco-deb.zip
          unzip -o convco-deb.zip
          sudo dpkg -i convco*.deb
      - name: Restore
        run: dotnet restore rHXLib.sln
      - name: Build
        run: dotnet build rHXLib.sln -c Release --no-restore
      - name: Test
        run: dotnet test rHXLib.sln -c Release --no-build --logger 'trx;LogFileName=test-results.trx'
      - name: Compute version with convco
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(convco version --bump -p '' || echo '')
          if [ -z "$BASE" ]; then BASE="0.1.0"; fi
          META="+${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          echo "value=${BASE}${META}" >> $GITHUB_OUTPUT
      - name: Pack
        run: dotnet pack rHXLib/src/rHXLib/rHXLib.csproj -c Release -o ./artifacts /p:PackageVersion=${{ steps.version.outputs.value }}
      - name: Add GitHub Packages source
        shell: bash
        run: |
          OWNER=${GITHUB_REPOSITORY%%/*}
          dotnet nuget add source "https://nuget.pkg.github.com/${OWNER}/index.json" --name github --username "${OWNER}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      - name: Push package to GitHub Packages
        run: dotnet nuget push artifacts/*.nupkg --source "github" --skip-duplicate --api-key ${{ secrets.GITHUB_TOKEN }}
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
