name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore rHXLib.sln
      - name: Build
        run: dotnet build rHXLib.sln -c Release --no-restore
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: dotnet test rHXLib.sln -c Release -f net8.0 --no-build --logger 'trx;LogFileName=test-results.trx'
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: dotnet test rHXLib.sln -c Release --no-build --logger 'trx;LogFileName=test-results.trx'
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            **/coverage.cobertura.xml
          if-no-files-found: ignore
